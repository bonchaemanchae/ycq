# Serves the built React app and forwards /api/* to the FastAPI container.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
    }

    # React Router: unknown paths load the app, which picks the page.
    location / {
        try_files $uri /index.html;
    }
}
