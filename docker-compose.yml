name: ycq

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ycq}
      POSTGRES_USER: ${POSTGRES_USER:-ycq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: UTC
    command: >
      postgres
        -c shared_buffers=512MB
        -c work_mem=64MB
        -c maintenance_work_mem=512MB
        -c max_wal_size=4GB
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ycq} -d ${POSTGRES_DB:-ycq}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-ycq}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Loads everything once: downloads the TLC files into ./data, applies the
  # schema, loads zones and imports each month, then exits. On later starts it
  # sees the months are already loaded and exits within seconds.
  # YCQ_MONTHS in .env picks the months (default: all three).
  loader:
    build:
      context: .
      dockerfile: etl/Dockerfile
    environment: &db_env
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-ycq}
      POSTGRES_USER: ${POSTGRES_USER:-ycq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_DB: ${MONGO_DB:-ycq}
      MONGO_USER: ${MONGO_USER:-ycq}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      # The API's own login (readWrite on the ycq database only), created by
      # the loader. The loader itself uses the root user above.
      MONGO_APP_USER: ${MONGO_APP_USER:-ycq_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-change-me-app}
      YCQ_MONTHS: ${YCQ_MONTHS:-2026-01 2026-02 2026-03}
      YCQ_DOWNLOAD: ${YCQ_DOWNLOAD:-1}
      # Passwords of the default accounts (scripts/seed_users.py); unset = not created.
      YCQ_ADMIN_PASSWORD: ${YCQ_ADMIN_PASSWORD:-}
      YCQ_ANALYST1_PASSWORD: ${YCQ_ANALYST1_PASSWORD:-}
      YCQ_ANALYST2_PASSWORD: ${YCQ_ANALYST2_PASSWORD:-}
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

  # FastAPI backend: http://localhost:8000/docs
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      <<: *db_env
      MONGO_USER: ${MONGO_APP_USER:-ycq_app}
      MONGO_PASSWORD: ${MONGO_APP_PASSWORD:-change-me-app}
      # The default accounts' passwords are only for the loader.
      YCQ_ADMIN_PASSWORD: ""
      YCQ_ANALYST1_PASSWORD: ""
      YCQ_ANALYST2_PASSWORD: ""
      # Signs login tokens. The api refuses to start if it is under 32 characters.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      loader:
        condition: service_completed_successfully

  # React app: http://localhost:8080 (forwards /api to the api service)
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  pgdata:
  mongodata:
